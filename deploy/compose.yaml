name: snuarchive

x-api-image: &api-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: snuarchive/api:local

x-database-url: &database-url postgres://${POSTGRES_USER:-snuarchive}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-snuarchive}?sslmode=disable

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snuarchive}
      POSTGRES_USER: ${POSTGRES_USER:-snuarchive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        ipv4_address: ${DB_IP:-172.30.0.4}
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: *database-url
    networks:
      default:
        ipv4_address: ${MIGRATE_IP:-172.30.0.6}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *api-image
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: ":8080"
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: /data/uploads
      # only Caddy and the React SSR server are trusted to set X-Forwarded-For;
      # Caddy always overwrites X-Request-ID with its own generated ID before
      # forwarding (web will do the same once it exists), so Go only ever
      # sees an ID one of these two made
      TRUSTED_PROXIES: ${CADDY_IP:-172.30.0.2}/32,${WEB_IP:-172.30.0.3}/32
    networks:
      default:
        ipv4_address: ${APP_IP:-172.30.0.5}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: ${CADDY_IP:-172.30.0.2}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # web (React SSR, frontend phase) goes here with the reserved address:
  #   networks:
  #     default:
  #       ipv4_address: ${WEB_IP:-172.30.0.3}

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.0.0/24}
          # Docker hands out dynamic addresses (`docker compose run`, any
          # container attached without ipv4_address) only from ip_range. The
          # fixed addresses above (CADDY_IP, WEB_IP, DB_IP, APP_IP, MIGRATE_IP)
          # must stay outside it: Docker does not hold a stopped container's
          # fixed address, so without this a one-off container could take
          # CADDY_IP while Caddy is down and be trusted as a proxy
          ip_range: ${COMPOSE_IP_RANGE:-172.30.0.128/25}

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
