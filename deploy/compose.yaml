name: snuarchive

x-api-image: &api-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: snuarchive/api:local

x-database-url: &database-url postgres://${POSTGRES_USER:-snuarchive}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-snuarchive}?sslmode=disable

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snuarchive}
      POSTGRES_USER: ${POSTGRES_USER:-snuarchive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *api-image
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: ":8080"
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: /data/uploads
      # only Caddy and the React SSR server may set X-Forwarded-For / X-Request-ID
      TRUSTED_PROXIES: ${CADDY_IP:-172.30.0.2}/32,${WEB_IP:-172.30.0.3}/32
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: ${CADDY_IP:-172.30.0.2}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # web (React SSR, frontend phase) goes here with the reserved address:
  #   networks:
  #     default:
  #       ipv4_address: ${WEB_IP:-172.30.0.3}

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.0.0/24}
          # dynamic addresses come only from this range, so they never take
          # the fixed CADDY_IP / WEB_IP (which must lie outside it)
          ip_range: ${COMPOSE_IP_RANGE:-172.30.0.128/25}

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
