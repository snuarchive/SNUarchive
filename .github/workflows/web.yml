# Checks the React app (web/) and its mock API (web/mock-api/). The mock's
# contract tests skip here: web/api/openapi.yaml is a local symlink into the
# Go backend until the two branches are merged.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "20*.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "20*.json", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            web/mock-api/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir mock-api install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --dir mock-api typecheck

      - name: Lint and format
        run: |
          pnpm lint
          pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Mock API tests
        run: pnpm --dir mock-api test

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E against the mock
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
